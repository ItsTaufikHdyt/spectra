# Konfigurasi wilayah untuk "Kondisi Terkini" (backend/app/terkini.py).
# Diverifikasi 2026-11-22.

pusat_bontang: {lat: 0.1143, lon: 117.4771}   # tengah kotak batas 15 kelurahan (jarak gempa dihitung dari sini)

# Kode adm4 (kode wilayah Kemendagri) diambil dari atribut `kdpumdes` pada
# data-pipeline/processed/geojson/batas-kelurahan.norm.geojson (data batas resmi geoportal Pemkot).
# VERIFIKASI: tiap kode dipanggil ke https://api.bmkg.go.id/publik/prakiraan-cuaca?adm4=<kode>; semua 15 mengembalikan
# data dan nama desa/kecamatan sama dengan nama kelurahan di data batas (selisih ejaan: "Lok Tuan", "Berbas", "Api-api").
kelurahan:
  - {slug: bontang_kuala, nama: "Bontang Kuala", adm4: "64.74.01.1001"}
  - {slug: bontang_baru, nama: "Bontang Baru", adm4: "64.74.01.1002"}
  - {slug: loktuan, nama: "Loktuan", adm4: "64.74.01.1003"}
  - {slug: guntung, nama: "Guntung", adm4: "64.74.01.1004"}
  - {slug: gunung_elai, nama: "Gunung Elai", adm4: "64.74.01.1005"}
  - {slug: api_api, nama: "Api Api", adm4: "64.74.01.1006"}
  - {slug: tanjung_laut, nama: "Tanjung Laut", adm4: "64.74.02.1001"}
  - {slug: berebas_tengah, nama: "Berebas Tengah", adm4: "64.74.02.1002"}
  - {slug: berebas_pantai, nama: "Berebas Pantai", adm4: "64.74.02.1003"}
  - {slug: satimpo, nama: "Satimpo", adm4: "64.74.02.1004"}
