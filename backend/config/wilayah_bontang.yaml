# Titik laut Open-Meteo Marine (hasil Tahap 0). Open-Meteo memilih sel laut terdekat (resolusi ±0,08°, ±9 km); titik
# darat pun dikembalikan sebagai sel laut terdekat. Koordinat di bawah adalah SEL YANG DIKEMBALIKAN API (lat/lon respons),
# ±13 km di timur pantai Bontang (Selat Makassar), bukan perairan dangkal tepat di pantai. Semua nilai tidak null (48/48 jam).
laut:
  - {id: utara,   nama: "Laut utara (depan Lok Tuan)",       lat: 0.20833588, lon: 117.625015}
  - {id: tengah,  nama: "Laut tengah (depan Bontang Kuala)", lat: 0.125,      lon: 117.625015}
  - {id: selatan, nama: "Laut selatan (depan Tanjung Laut)", lat: 0.041664124, lon: 117.625015}

# Bbox FIRMS = kotak batas 15 kelurahan (117.3883, 0.0225, 117.5659, 0.2060) + buffer 20 km. Urutan: west,south,east,north.
firms:
  bbox: "117.2087,-0.1572,117.7455,0.3857"
  sumber: [VIIRS_SNPP_NRT, VIIRS_NOAA20_NRT, VIIRS_NOAA21_NRT]
  hari: 3
